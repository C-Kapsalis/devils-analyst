 <text x="48" y="142" font-family="Inter,Arial,sans-serif" font-size="36" font-weight="750" fill="#18222B">Local rules, without false arithmetic</text>
 <text x="48" y="190" font-family="Inter,Arial,sans-serif" font-size="19" fill="#56616B">Team-specific definitions can override defaults, but not mathematical validity.</text>
