<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
 <title id="title">Local rules, without false arithmetic</title><desc id="desc">Team-specific definitions can override defaults, but not mathematical validity. House rules can govern interpretation; they cannot make invalid arithmetic true</desc>
