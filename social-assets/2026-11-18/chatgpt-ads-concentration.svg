<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
<title id="title">ChatGPT ads: sales were concentrated</title>
<desc id="desc">October 2026 preprint under review. Paid ChatGPT visits generated 0.89 dollars per US session versus 2.45 dollars for paid Google Search. Among 87 advertisers buying both channels, 73 recorded zero ChatGPT sales across 18,726 sessions; 14 recorded all 570 transactions. One advertiser accounted for 66 percent of purchases across 102 sites. Paid comparison is observational, not causal.</desc>
<rect width="1200" height="675" fill="#0b1220"/>
<rect x="30" y="28" width="1140" height="619" rx="26" fill="#111c2e" stroke="#26354d" stroke-width="2"/>
<text x="66" y="88" fill="#f8fafc" font-family="Inter,Arial,sans-serif" font-size="38" font-weight="700">ChatGPT ads: sales were concentrated</text>
<text x="68" y="126" fill="#9fb0c8" font-family="Inter,Arial,sans-serif" font-size="20">October 2026 preprint · under review · US paid-channel evidence</text>
<rect x="66" y="158" width="506" height="164" rx="18" fill="#17263b" stroke="#31445f"/>
<text x="94" y="196" fill="#9fb0c8" font-family="Inter,Arial,sans-serif" font-size="18" letter-spacing="1">REVENUE PER US SESSION</text>
<text x="96" y="264" fill="#f8fafc" font-family="Inter,Arial,sans-serif" font-size="50" font-weight="700">$0.89</text>
<text x="96" y="294" fill="#cbd5e1" font-family="Inter,Arial,sans-serif" font-size="18">Paid ChatGPT</text>
<text x="326" y="264" fill="#5eead4" font-family="Inter,Arial,sans-serif" font-size="50" font-weight="700">$2.45</text>
<text x="326" y="294" fill="#cbd5e1" font-family="Inter,Arial,sans-serif" font-size="18">Paid Google Search</text>
<rect x="596" y="158" width="538" height="164" rx="18" fill="#17263b" stroke="#31445f"/>
<text x="624" y="196" fill="#9fb0c8" font-family="Inter,Arial,sans-serif" font-size="18" letter-spacing="1">ADVERTISERS BUYING BOTH CHANNELS</text>
<text x="628" y="270" fill="#f8fafc" font-family="Inter,Arial,sans-serif" font-size="60" font-weight="700">87</text>
<text x="738" y="242" fill="#fca5a5" font-family="Inter,Arial,sans-serif" font-size="26" font-weight="700">73</text>
<text x="786" y="242" fill="#cbd5e1" font-family="Inter,Arial,sans-serif" font-size="18">zero ChatGPT sales</text>
<text x="738" y="280" fill="#5eead4" font-family="Inter,Arial,sans-serif" font-size="26" font-weight="700">14</text>
<text x="786" y="280" fill="#cbd5e1" font-family="Inter,Arial,sans-serif" font-size="18">made all 570 transactions</text>
<text x="628" y="304" fill="#9fb0c8" font-family="Inter,Arial,sans-serif" font-size="15">73 zero-sale advertisers recorded 18,726 visits</text>
<rect x="66" y="348" width="1068" height="104" rx="18" fill="#17263b" stroke="#31445f"/>
<text x="96" y="390" fill="#9fb0c8" font-family="Inter,Arial,sans-serif" font-size="17" letter-spacing="1">ACROSS THE 102-SITE ADVERTISER SAMPLE</text>
<text x="96" y="431" fill="#f8fafc" font-family="Inter,Arial,sans-serif" font-size="34" font-weight="700">One advertiser accounted for 66% of paid ChatGPT purchases</text>
<rect x="66" y="476" width="1068" height="78" rx="14" fill="#24334a"/>
<text x="94" y="509" fill="#f8fafc" font-family="Inter,Arial,sans-serif" font-size="19" font-weight="600">Interpretation</text>
<text x="94" y="535" fill="#cbd5e1" font-family="Inter,Arial,sans-serif" font-size="17">The paid-channel comparison is observational, not a causal test.</text>
<text x="68" y="603" fill="#91a4bf" font-family="Inter,Arial,sans-serif" font-size="16">Source: Kaiser &amp; Schulze, “Can Advertising Fund Free AI?” · preprint, October 2026</text>
