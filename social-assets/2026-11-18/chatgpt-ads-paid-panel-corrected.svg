<text x="628" y="270" fill="#f8fafc" font-family="Inter,Arial,sans-serif" font-size="58" font-weight="700">387</text>
<text x="760" y="238" fill="#fca5a5" font-family="Inter,Arial,sans-serif" font-size="28" font-weight="700">84%</text>
<text x="835" y="238" fill="#cbd5e1" font-family="Inter,Arial,sans-serif" font-size="17">no transaction</text>
