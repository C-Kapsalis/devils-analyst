<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
<title id="title">ChatGPT ads: a concentrated paid-channel panel</title>
<desc id="desc">October 2026 preprint under review. Across 387 websites with paid ChatGPT referrals, 84 percent recorded no paid transaction despite 18,726 sessions; 14 websites accounted for all 570 transactions. In the 102-advertiser financial sample, one advertiser accounted for 66 percent of paid ChatGPT purchases. In US traffic, revenue per paid session was 0.89 dollars for ChatGPT versus 2.45 dollars for Google Search. Advertiser entry was self-chosen, so the paid-channel comparison is descriptive, not causal.</desc>
