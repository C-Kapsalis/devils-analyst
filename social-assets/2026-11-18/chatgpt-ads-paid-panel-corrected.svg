<text x="96" y="431" fill="#f8fafc" font-family="Inter,Arial,sans-serif" font-size="34" font-weight="700">One advertiser accounted for 66% of purchases</text>
<rect x="66" y="476" width="1068" height="78" rx="14" fill="#24334a"/>
