<text x="94" y="535" fill="#cbd5e1" font-family="Inter,Arial,sans-serif" font-size="17">Advertiser entry was self-chosen; the paid-channel comparison is descriptive, not causal.</text>
<text x="68" y="592" fill="#91a4bf" font-family="Inter,Arial,sans-serif" font-size="14">Data supplied by Grips Intelligence; one author is its scientific advisor. The paper reports no role in design or analysis.</text>
