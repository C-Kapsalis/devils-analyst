<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
<title id="title">Attributed revenue is not incremental lift</title>
<desc id="desc">Synthetic benchmark case, not customer data. The post-purchase email flow has the highest attributed revenue but its holdout performs like control, showing no incremental lift. The abandoned-checkout flow shows a large holdout lift. The decision should follow incremental evidence, not attributed totals alone.</desc>
<rect width="1200" height="675" fill="#f5f3ed"/>
<rect x="0" y="0" width="14" height="675" fill="#245a57"/>
<text x="70" y="62" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="700" letter-spacing="2.5" fill="#9a6b2f">FIELD NOTE  /  19 NOV 2026</text>
<text x="70" y="119" font-family="Inter,Arial,sans-serif" font-size="39" font-weight="750" fill="#1c2a33">Attributed revenue is not incremental lift</text>
<text x="70" y="157" font-family="Inter,Arial,sans-serif" font-size="19" fill="#52616a">Synthetic email benchmark case · not customer data</text>
<line x1="70" y1="184" x2="1130" y2="184" stroke="#d5dbd6" stroke-width="2"/>
<rect x="70" y="220" width="500" height="300" rx="18" fill="#ffffff" stroke="#d9dfda" stroke-width="2"/>
<rect x="70" y="220" width="9" height="300" rx="4" fill="#9a6b2f"/>
<text x="105" y="265" font-family="Inter,Arial,sans-serif" font-size="16" font-weight="700" letter-spacing="1.5" fill="#9a6b2f">POST-PURCHASE</text>
<text x="105" y="315" font-family="Inter,Arial,sans-serif" font-size="27" font-weight="700" fill="#1c2a33">Highest attributed revenue</text>
<line x1="105" y1="345" x2="535" y2="345" stroke="#e2e5df" stroke-width="2"/>
<text x="105" y="392" font-family="Inter,Arial,sans-serif" font-size="20" font-weight="700" fill="#8b4b38">Holdout ≈ control</text>
<text x="105" y="430" font-family="Inter,Arial,sans-serif" font-size="18" fill="#52616a">No incremental lift in the case</text>
<rect x="105" y="458" width="250" height="34" rx="17" fill="#f4e7e1"/>
<text x="125" y="481" font-family="Inter,Arial,sans-serif" font-size="14" font-weight="700" fill="#8b4b38">CREDIT ≠ CONTRIBUTION</text>
<rect x="630" y="220" width="500" height="300" rx="18" fill="#ffffff" stroke="#d9dfda" stroke-width="2"/>
<rect x="630" y="220" width="9" height="300" rx="4" fill="#245a57"/>
<text x="665" y="265" font-family="Inter,Arial,sans-serif" font-size="16" font-weight="700" letter-spacing="1.5" fill="#245a57">ABANDONED CHECKOUT</text>
<text x="665" y="315" font-family="Inter,Arial,sans-serif" font-size="27" font-weight="700" fill="#1c2a33">Holdout shows a large lift</text>
<line x1="665" y1="345" x2="1095" y2="345" stroke="#e2e5df" stroke-width="2"/>
<text x="665" y="392" font-family="Inter,Arial,sans-serif" font-size="20" font-weight="700" fill="#245a57">Treatment beats control</text>
<text x="665" y="430" font-family="Inter,Arial,sans-serif" font-size="18" fill="#52616a">Evidence of incremental contribution</text>
<rect x="665" y="458" width="250" height="34" rx="17" fill="#e4eeea"/>
<text x="685" y="481" font-family="Inter,Arial,sans-serif" font-size="14" font-weight="700" fill="#245a57">TEST THE OUTCOME</text>
<text x="70" y="574" font-family="Inter,Arial,sans-serif" font-size="23" font-weight="700" fill="#1c2a33">The budget decision follows the holdout evidence, not the attributed total.</text>
<text x="70" y="625" font-family="Inter,Arial,sans-serif" font-size="14" fill="#738078">Independent technical and product reporting · Source: Devil's Analyst synthetic benchmark case</text>
</svg>