<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-label="A good audit knows what not to flag."><rect width="1200" height="675" fill="#f7f7f3"/><rect x="64" y="52" width="8" height="34" rx="4" fill="#4263eb"/><text x="92" y="76" font-family="Inter,Arial,sans-serif" font-size="20" font-weight="700" letter-spacing="2" fill="#4263eb">ANALYTICS REVIEW</text><text x="64" y="145" font-family="Inter,Arial,sans-serif" font-size="43" font-weight="700" fill="#172338">A good audit knows what not to flag.</text><text x="64" y="190" font-family="Inter,Arial,sans-serif" font-size="23" fill="#5b6678">Different measurement systems can disagree without either one being broken.</text><rect x="89" y="250" width="326" height="230" rx="18" fill="#ffffff" stroke="#d9dfeb" stroke-width="2"/><rect x="89" y="250" width="326" height="10" rx="5" fill="#4263eb"/><text x="111" y="302" font-family="Inter,Arial,sans-serif" font-size="19" font-weight="700" fill="#172338">SEARCH CONSOLE</text><text x="111" y="348" font-family="Inter,Arial,sans-serif" font-size="22" fill="#5b6678">Counts clicks</text><text x="111" y="382" font-family="Inter,Arial,sans-serif" font-size="22" fill="#5b6678">from Google Search</text><text x="111" y="416" font-family="Inter,Arial,sans-serif" font-size="22" fill="#5b6678">A click is not</text><text x="111" y="450" font-family="Inter,Arial,sans-serif" font-size="22" fill="#5b6678">an analytics session</text><path d="M 419 365 h 14 m -10 -8 l 10 8 l -10 8" fill="none" stroke="#4263eb" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><rect x="437" y="250" width="326" height="230" rx="18" fill="#ffffff" stroke="#d9dfeb" stroke-width="2"/><rect x="437" y="250" width="326" height="10" rx="5" fill="#4263eb"/><text x="459" y="302" font-family="Inter,Arial,sans-serif" font-size="19" font-weight="700" fill="#172338">GA4</text><text x="459" y="348" font-family="Inter,Arial,sans-serif" font-size="22" fill="#5b6678">Counts tagged sessions</text><text x="459" y="382" font-family="Inter,Arial,sans-serif" font-size="22" fill="#5b6678">subject to consent,</text><text x="459" y="416" font-family="Inter,Arial,sans-serif" font-size="22" fill="#5b6678">blockers and page-load</text><text x="459" y="450" font-family="Inter,Arial,sans-serif" font-size="22" fill="#5b6678">behaviour</text><path d="M 767 365 h 14 m -10 -8 l 10 8 l -10 8" fill="none" stroke="#4263eb" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><rect x="785" y="250" width="326" height="230" rx="18" fill="#ffffff" stroke="#d9dfeb" stroke-width="2"/><rect x="785" y="250" width="326" height="10" rx="5" fill="#4263eb"/><text x="807" y="302" font-family="Inter,Arial,sans-serif" font-size="19" font-weight="700" fill="#172338">REVIEW THE CLAIM</text><text x="807" y="348" font-family="Inter,Arial,sans-serif" font-size="22" fill="#5b6678">Do not call the gap</text><text x="807" y="382" font-family="Inter,Arial,sans-serif" font-size="22" fill="#5b6678">'lost traffic' by default</text><text x="807" y="416" font-family="Inter,Arial,sans-serif" font-size="22" fill="#5b6678">Flag if the report</text><text x="807" y="450" font-family="Inter,Arial,sans-serif" font-size="22" fill="#5b6678">misinterprets it</text><line x1="64" y1="555" x2="1136" y2="555" stroke="#d9dfeb" stroke-width="2"/><text x="64" y="598" font-family="Inter,Arial,sans-serif" font-size="19" fill="#5b6678">Example of an expected measurement difference · not a universal tolerance threshold</text><text x="1136" y="635" text-anchor="end" font-family="Inter,Arial,sans-serif" font-size="15" letter-spacing="1.5" fill="#8791a2">FIELD NOTE · 22 NOV 2026</text></svg>