# Counts, skill description lengths and generated adapter copies.
name: check

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Counts and skill description lengths (fails over 1,024 characters)
        run: python3 scripts/count.py
      - name: Generated adapter copies are current
        run: python3 scripts/sync-adapters.py --check
